# Dependabot security updates only. Version updates are off
# (open-pull-requests-limit: 0) because routine bumps go in the monthly update
# pull request, which keeps every dependency on an exact, reviewed version.
# Security update pull requests still open for packages with a Dependabot alert.
# See "Keeping VoiceInk updated" in BUILDING.md.
version: 2
updates:
  # Swift packages from VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # Actions in .github/workflows, pinned by commit SHA
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
